name: Release zip

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip
        id: build
        run: |
          tag_name="$GITHUB_REF_NAME"
          version="${tag_name#v}"
          version="${version#V}"
          zip_name="${GITHUB_REPOSITORY#*/}-${version}.zip"
          zip -r "$zip_name" gamedata README.md
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Create release and upload zip
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ steps.build.outputs.zip_name }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP_NAME" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
